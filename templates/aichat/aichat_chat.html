<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天窗口</title>
    <link rel="stylesheet" href="/static/css/common.css?v={{ static_ver }}">
    <link rel="stylesheet" href="/static/css/chat.css?v={{ static_ver }}">
</head>
<body>
    <div class="chat-window">
        <!-- 顶部标题栏 -->
        <header class="chat-header">
            <span class="chat-header-title" id="chatTitle">AI 对话</span>
            <span class="chat-model-tag">{{ powered_by }}</span>
        </header>

        <!-- 消息列表区 -->
        <div class="chat-messages" id="chatMessages">
            <div class="chat-messages-inner" id="chatMessagesInner">
                <div class="chat-empty">
                    <div class="chat-empty-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </div>
                    <div class="chat-empty-title">开始对话</div>
                    <div class="chat-empty-subtitle">在下方输入框中提出你的问题</div>
                </div>
            </div>
        </div>

        <!-- 输入区 -->
        <footer class="chat-input-area">
            <div class="chat-input-inner">
                <textarea class="chat-input" id="chatInput"
                    placeholder="发送消息" rows="1"></textarea>
                <button class="chat-send-btn" id="sendBtn" title="发送">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            <div class="chat-input-hint">Enter 发送 · Shift+Enter 换行</div>
        </footer>
    </div>

    <script src="/static/js/common.js?v={{ static_ver }}"></script>
    <script src="/static/js/chat.js?v={{ static_ver }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天对话 - Aegis</title>
    <link rel="stylesheet" href="/static/css/common.css?v={{ static_ver }}">
    <link rel="stylesheet" href="/static/css/aichat.css?v={{ static_ver }}">
</head>
<body>
    <div class="aichat-wrap">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">AI</span>
                <span class="sidebar-title">Aegis</span>
                <a href="/" class="sidebar-back" title="返回首页">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </a>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                新建对话
            </button>

            <div class="session-search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" id="sessionSearch" placeholder="搜索会话..." />
            </div>

            <div class="session-list" id="sessionList">
                <div style="padding:30px;text-align:center;color:var(--text-dark-secondary);font-size:13px;">
                    <span class="spinner"></span> 加载中...
                </div>
            </div>

            <div class="sidebar-footer">Powered by {{ powered_by }}</div>
        </aside>

        <!-- 聊天区域 -->
        <main class="chat-area">
            <iframe id="chatFrame" src="about:blank"></iframe>
        </main>
    </div>

    <script src="/static/js/common.js?v={{ static_ver }}"></script>
    <script src="/static/js/aichat.js?v={{ static_ver }}"></script>
</body>
</html>
